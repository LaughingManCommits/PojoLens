[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pojolens-agents"
version = "0.1.0"
description = "Repo-local PojoLens multi-agent orchestration CLI"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
sdk = ["anthropic>=0.40.0"]
tui = ["textual>=0.60,<1"]
otel = [
    "opentelemetry-sdk>=1.28.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0,<2",
]

[project.scripts]
pojolens-agents = "pojo_lens_agents.cli:main"

[tool.setuptools]
package-dir = {"" = "scripts/ai"}
packages = ["pojo_lens_agents"]

[tool.setuptools.package-data]
pojo_lens_agents = ["py.typed"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_implicit_optional = false
disable_error_code = ["no-redef"]

[[tool.mypy.overrides]]
module = [
    "pojo_lens_agents.evals",
    "pojo_lens_agents.langgraph_spike",
    "pojo_lens_agents.orchestrator_app",
    "pojo_lens_agents.plan_support",
    "pojo_lens_agents.provider_worker",
    "pojo_lens_agents.review_ops",
    "pojo_lens_agents.run_ops",
    "pojo_lens_agents.run_summary",
    "pojo_lens_agents.task_execution",
    "pojo_lens_agents.trace_export",
    "pojo_lens_agents.validation_ops",
    "pojo_lens_agents.workspace_run_review",
]
ignore_errors = true
