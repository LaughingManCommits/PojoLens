spring:
  datasource:
    url: jdbc:h2:mem:riskconsole;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always

pojo-lens:
  preset: DEV
  strict-parameter-types: true
  lint-mode: true
  telemetry:
    micrometer:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

risk-console:
  seed:
    enabled: true
    seed: 4242
    merchant-count: 240
    customer-count: 3200
    transaction-count: 28000
