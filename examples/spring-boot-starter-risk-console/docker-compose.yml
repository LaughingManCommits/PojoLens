services:
  mysql:
    image: mysql:8.4
    container_name: pojolens-risk-console-mysql
    environment:
      MYSQL_DATABASE: pojolens_demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
